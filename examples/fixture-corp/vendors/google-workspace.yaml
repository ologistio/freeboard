# Google Workspace - identity provider and email. Enforces MFA and is the
# system of record for user accounts.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-google-workspace
title: Google Workspace
type: Vendor
source: declared
owner: fixture-corp
tier: Critical
data_classes: [pii, credentials]
assurances:
  - standard: std-soc2
    expires: 2026-09-30
---
apiVersion: freeboard.dev/v1alpha1
kind: Scope
id: vs-google-workspace-mfa-in
title: Google Workspace enforces multi-factor authentication
subject: vendor-google-workspace
control: ctrl-fc-mfa
disposition: In
---
apiVersion: freeboard.dev/v1alpha1
kind: Scope
id: vs-google-workspace-user-access-in
title: Google Workspace is the account system of record
subject: vendor-google-workspace
requirement: req-ce-plus-user-access-control-01
disposition: In
