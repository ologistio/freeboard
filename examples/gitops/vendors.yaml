# Sample vendors as declared assets: the software, platforms, and external parties
# the organisation relies on. Collectors, evidence, and per-vendor exceptions map to
# these ids. Each vendor names an owner (a Company/Department asset) that makes it
# visible to that org's readers. CrowdStrike, Fleet, and Google Workspace are real
# named integrations; the remaining vendors are invented for illustration.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-crowdstrike
title: CrowdStrike Falcon
type: Vendor
source: declared
owner: ologist-products
tier: High
data_classes: [pii]
assurances:
  - standard: std-soc2
    expires: 2027-05-31
---
# Fleet holds device state, not regulated data, so it carries no data_classes.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-fleetdm
title: Fleet
type: Vendor
source: declared
owner: ologist-products
tier: Medium
---
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-google-workspace
title: Google Workspace
type: Vendor
source: declared
owner: ologist-products
tier: Critical
data_classes: [pii, credentials]
assurances:
  - standard: std-soc2
    expires: 2026-09-30
  # ISO recertification audits book up further out, so this one warns earlier.
  - standard: std-iso-27001
    expires: 2027-02-28
    warn_days: 120
---
# Invented: a SaaS accounting package that supports MFA but not SSO.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-ledgerleaf
title: LedgerLeaf Accounting (example)
type: Vendor
source: declared
owner: ologist-products
tier: High
data_classes: [pii]
# Already lapsed. An expiry in the past is a real state, not a validation error.
assurances:
  - standard: std-soc2
    expires: 2026-06-30
---
# Invented: an external accountancy firm with no logins to our systems. It holds no
# certification, which is a normal state and produces no diagnostic.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-quill-accountancy
title: Quill Accountancy Ltd (example)
type: Vendor
source: declared
owner: ologist-products
tier: Medium
data_classes: [pii]
---
# Invented: a managed VPN appliance configured by the vendor under contract.
apiVersion: freeboard.dev/v1alpha1
kind: Asset
id: vendor-sentinel-vpn
title: Sentinel VPN (example)
type: Vendor
source: declared
owner: ologist-products
tier: High
data_classes: [credentials]
